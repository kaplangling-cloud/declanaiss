# =====================================================================
#  Production (Ubuntu Server) — surcharge du compose de base :
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#  - Nginx en HTTPS (Let's Encrypt / Certbot, renouvellement automatique)
#  - PostgreSQL non expose sur l'hote
#  - Sauvegardes chiffrees quotidiennes (service backup)
# =====================================================================
services:
  postgres:
    ports: !reset []

  app:
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "10" }

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    environment:
      SERVER_NAME: ${SERVER_NAME}
    command: ["/bin/sh", "-c", "envsubst '$$SERVER_NAME' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # Premiere emission : voir README (certonly --webroot). Ensuite renouvellement toutes les 12 h.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - storage:/var/lib/declanaiss/storage:ro
      - ${BACKUP_DIR:-/var/backups/declanaiss}:/backups
    depends_on:
      - postgres
    # Sauvegarde quotidienne a 02:00 (heure du conteneur, TZ herite du .env)
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache gnupg >/dev/null; while :; do now=$$(date +%H:%M); [ \"$$now\" = \"02:00\" ] && sh /backup.sh; sleep 60; done"]

volumes:
  certbot-www:
  certbot-conf:
