# Developpement / local : HTTP simple, frontend statique + proxy API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API
    location /api/ {
        proxy_pass http://app:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Jamais de cache sur l'API (donnees personnelles)
        add_header Cache-Control "no-store" always;
    }

    # Service worker et manifest : toujours a jour
    location ~* ^/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        types { application/manifest+json webmanifest; application/javascript js; }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Assets versionnes (hash dans le nom)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
